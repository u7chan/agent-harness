<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>モデル設定</title>
    <script>
      // Apply a saved theme choice before the first paint so the page never flashes the other theme.
      try {
        const saved = localStorage.getItem("pi-model-editor-theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (error) {
        // Storage can be unavailable; the page then follows the OS setting.
      }
    </script>
    <style>
      /*
       * Each token is defined once as light-dark(light, dark). The page follows
       * the OS until the toggle sets data-theme, which pins color-scheme (and so
       * every token and the native controls) to the chosen theme.
       */
      :root {
        color-scheme: light dark;
        --fg: light-dark(#1b1b1f, #ececf1);
        --muted: light-dark(#62626b, #a0a0ab);
        --line: light-dark(#d9d9e0, #37373f);
        --bg: light-dark(#f7f7fa, #141418);
        --card: light-dark(#ffffff, #1d1d23);
        --accent: light-dark(#0a5cc2, #7aa7ff);
        --on-accent: light-dark(#ffffff, #10141c);
        --warn-bg: light-dark(#fff4e0, #3a2f16);
        --warn-fg: light-dark(#7a4a00, #f0c674);
        --err: light-dark(#b3261e, #ff8a80);
        --ok: light-dark(#1a7f37, #7ee2a8);
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      header.bar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        padding: 1rem clamp(1rem, 4vw, 2rem);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 1.1rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.15rem 0.6rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .badge.stale {
        border-color: var(--warn-fg);
        color: var(--warn-fg);
      }
      button {
        font: inherit;
        padding: 0.4rem 0.85rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      /* Unsaved changes turn the save button into the one filled control. */
      button.primary.dirty {
        background: var(--accent);
        color: var(--on-accent);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .status {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin: 0;
        padding: 0.6rem clamp(1rem, 4vw, 2rem);
        min-height: 1.6rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .status.error {
        color: var(--err);
      }
      .profiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 36rem), 1fr));
        gap: 1rem;
        align-items: start;
        padding: 0 clamp(1rem, 4vw, 2rem) 1.5rem;
      }
      .card {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .card > .head {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .card h2 {
        margin: 0;
        font-size: 1rem;
      }
      .state {
        margin-right: auto;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .state.dirty {
        color: var(--warn-fg);
      }
      .state.saved {
        color: var(--ok);
      }
      .state.failed {
        color: var(--err);
      }
      .role {
        display: grid;
        gap: 0.35rem;
      }
      .role.off .controls {
        display: none;
      }
      .role-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1rem;
        align-items: center;
        justify-content: space-between;
        min-height: 1.5rem;
      }
      .role-name {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .role.off .role-name {
        color: var(--muted);
        font-weight: 400;
      }
      input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        margin: 0;
        accent-color: var(--accent);
      }
      .switch {
        display: inline-flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.82rem;
        color: var(--muted);
      }
      /*
       * One grid serves every role, so the harness, model, level and permission
       * columns line up across rows and keep their place when a role switches
       * harness. A narrow card stacks them in two columns and names each field.
       */
      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        min-width: 0;
      }
      .field {
        min-width: 0;
      }
      .f-model {
        grid-column: 1 / -1;
        order: -1;
      }
      .cap {
        display: block;
        margin-bottom: 0.15rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .cols {
        display: none;
        gap: 0.5rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--muted);
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.4rem;
      }
      @container (min-width: 36rem) {
        .controls,
        .cols {
          grid-template-columns: 6rem minmax(0, 1fr) 7.5rem 8.5rem;
        }
        .cols {
          display: grid;
        }
        .f-model {
          grid-column: auto;
          order: 0;
        }
        .cap {
          display: none;
        }
      }
      select,
      input[type="text"] {
        width: 100%;
        padding: 0.4rem 0.5rem;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      select:disabled,
      input:disabled {
        opacity: 0.6;
      }
      .warn {
        margin: 0;
        padding: 0.5rem 0.6rem;
        background: var(--warn-bg);
        color: var(--warn-fg);
        border-radius: 8px;
        font-size: 0.82rem;
      }
      .warn[hidden] {
        display: none;
      }
      footer {
        padding: 0 clamp(1rem, 4vw, 2rem) 2rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>モデル設定</h1>
      <div class="toolbar">
        <span id="catalog" class="badge">読み込み中</span>
        <button id="refresh" type="button">Pi カタログ更新</button>
        <button id="theme" type="button"></button>
      </div>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <main id="profiles" class="profiles"></main>
    <footer>変更はこのマシンのプロファイルにだけ反映され、実行中のセッションには影響しません。</footer>
    <script>
      "use strict";

      const ROLE_ORDER = ["impl", "review", "pr-fix", "ui-tester", "orchestrator"];
      const ROLE_LABELS = {
        impl: "実装",
        review: "レビュー",
        "pr-fix": "修正",
        "ui-tester": "UI テスト",
        orchestrator: "オーケストレーター（チーム外）",
      };
      const REQUIRED_ROLES = ["impl", "review", "pr-fix"];
      const OPTIONAL_ROLES = new Set(["ui-tester", "orchestrator"]);
      // One header per grid column; the level column is Thinking for Pi and Effort for Claude.
      const COLUMN_HEADERS = ["ハーネス", "モデル", "Thinking / Effort", "権限モード"];

      const elements = {
        status: document.getElementById("status"),
        profiles: document.getElementById("profiles"),
        catalog: document.getElementById("catalog"),
        refresh: document.getElementById("refresh"),
        theme: document.getElementById("theme"),
      };

      let state = null;
      let busy = false;
      const drafts = new Map();

      function setStatus(message, isError) {
        elements.status.replaceChildren();
        elements.status.className = isError ? "status error" : "status";
        if (message) elements.status.append(document.createTextNode(message));
      }

      function withReloadButton(message) {
        setStatus(message, true);
        const button = el("button", { type: "button", text: "再読込" });
        button.addEventListener("click", () => load());
        elements.status.append(button);
      }

      function el(tag, options = {}) {
        const node = document.createElement(tag);
        if (options.className) node.className = options.className;
        if (options.text !== undefined) node.textContent = options.text;
        if (options.type) node.type = options.type;
        if (options.value !== undefined) node.value = options.value;
        if (options.id) node.id = options.id;
        if (options.disabled) node.disabled = true;
        if (options.checked) node.checked = true;
        return node;
      }

      /**
       * One control in a role's grid. The caption only shows when the card is
       * too narrow for the shared column header; the control carries its own
       * accessible name, so the caption is hidden from assistive technology.
       */
      function field(kind, caption, ...controls) {
        const wrap = el("div", { className: `field f-${kind}` });
        const cap = el("span", { className: "cap", text: caption });
        cap.setAttribute("aria-hidden", "true");
        wrap.append(cap, ...controls);
        return wrap;
      }

      /** Model candidates indexed by `provider\0model`; empty when the master is unusable. */
      function candidateIndex(models) {
        const index = new Map();
        if (!models || models.status !== "ok") return index;
        for (const provider of models.providers) {
          for (const model of provider.models) {
            index.set(`${provider.id}\u0000${model.id}`, { provider: provider.id, id: model.id, model });
          }
        }
        return index;
      }

      function levelsFor(candidate) {
        return candidate?.model?.supported_thinking || [];
      }

      /** The harness vocabularies come from the server, which owns their module. */
      function vocabularies() {
        return state.harnesses;
      }

      function roleHarness(spec) {
        return spec?.harness === "claude" ? "claude" : "pi";
      }

      function defaultRoleSpec(harness) {
        return harness === "claude"
          ? { harness: "claude", model: "", effort: "", permission_mode: "" }
          : { harness: "pi", provider: "", model: "", thinking: "" };
      }

      function roleComplete(spec) {
        if (!spec) return false;
        return roleHarness(spec) === "claude"
          ? Boolean(spec.model && spec.effort && spec.permission_mode)
          : Boolean(spec.provider && spec.model && spec.thinking);
      }

      /** A role spec reduced to the fields of its own harness, in a fixed order. */
      function normalizeSpec(spec) {
        return roleHarness(spec) === "claude"
          ? { harness: "claude", model: spec.model, effort: spec.effort, permission_mode: spec.permission_mode }
          : { harness: "pi", provider: spec.provider, model: spec.model, thinking: spec.thinking };
      }

      /**
       * What a save would send. The save button and the unsaved-change marker
       * both read it, so the marker means exactly "a save would change the
       * file". A role that is not complete is left out, as the server expects.
       */
      function savePayload(draft, specOf) {
        const roles = {};
        for (const role of ROLE_ORDER) {
          if (OPTIONAL_ROLES.has(role) && !draft.optional[role]) continue;
          const spec = specOf(draft.prFixShared && role === "pr-fix" ? "impl" : role);
          if (!roleComplete(spec)) continue;
          roles[role] = normalizeSpec(spec);
        }
        return { pr_fix_shared_with_impl: draft.prFixShared, roles };
      }

      function draftFor(profile) {
        const roles = {};
        for (const [role, spec] of Object.entries(profile.roles || {})) {
          const harness = roleHarness(spec);
          roles[role] =
            harness === "claude"
              ? {
                  harness,
                  model: spec.model || "",
                  effort: spec.effort || "",
                  permission_mode: spec.permission_mode || "",
                }
              : {
                  harness,
                  provider: spec.provider || "",
                  model: spec.model || "",
                  thinking: spec.thinking || "",
                };
        }
        const optional = {};
        for (const role of OPTIONAL_ROLES) optional[role] = Boolean(roles[role]);
        const draft = {
          name: profile.name,
          hash: profile.hash,
          error: profile.error,
          unknown: profile.unknown,
          prFixShared: profile.pr_fix_shared_with_impl === true,
          optional,
          roles,
          justSaved: false,
        };
        // The file as loaded, in the shape a save sends: edits are measured against it.
        draft.baseline = JSON.stringify(savePayload(draft, (role) => draft.roles[role]));
        return draft;
      }

      /**
       * Fill a thinking select. An unknown model keeps its stored level as the
       * only choice instead of offering levels the catalog cannot confirm, and
       * the base disabled state is recorded so a later enable does not mistake
       * the shared-flag lock for missing support.
       */
      function fillThinking(select, levels, current) {
        select.replaceChildren();
        // A stored level the master does not list still has to survive a save
        // that only touched another role, so it stays as a selectable option
        // instead of letting the browser fall back to the first level.
        const keepStored = levels.length > 0 && current !== "" && !levels.includes(current);
        const usable =
          levels.length > 0 ? (keepStored ? [current, ...levels] : levels) : current ? [current] : vocabularies().pi.thinking;
        for (const level of usable) {
          const option = el("option", { value: level, text: keepStored && level === current ? `${level}（候補外）` : level });
          if (level === current) option.selected = true;
          select.append(option);
        }
        if (!usable.includes(current) && current === "") select.value = usable[0];
        select.dataset.baseDisabled = levels.length === 0 ? "1" : "0";
        select.disabled = levels.length === 0;
      }

      /**
       * Fill a Claude vocabulary select. An empty choice keeps a role the user
       * has not finished visible as incomplete instead of picking a level, and
       * a stored value outside the vocabulary stays selectable so a save that
       * only touched another role does not rewrite it.
       */
      function fillVocabulary(select, values, current) {
        select.replaceChildren();
        const placeholder = el("option", { value: "", text: "（未選択）" });
        placeholder.selected = current === "";
        select.append(placeholder);
        for (const value of values) {
          const option = el("option", { value, text: value });
          if (value === current) option.selected = true;
          select.append(option);
        }
        if (current !== "" && !values.includes(current)) {
          const kept = el("option", { value: current, text: `${current}（候補外）` });
          kept.selected = true;
          select.append(kept);
        }
      }

      /** Pi fields: a catalog select when the master is usable, free text otherwise. */
      function piFields(role, index, spec, emit) {
        const harness = "pi";
        if (index.size === 0) {
          const providerInput = el("input", { type: "text", value: spec.provider || "" });
          providerInput.placeholder = "provider";
          providerInput.setAttribute("aria-label", `${role} provider`);
          const modelInput = el("input", { type: "text", value: spec.model || "" });
          modelInput.placeholder = "model id";
          modelInput.setAttribute("aria-label", `${role} model`);
          const thinkingSelect = el("select");
          thinkingSelect.setAttribute("aria-label", `${role} thinking`);
          fillThinking(thinkingSelect, vocabularies().pi.thinking, spec.thinking || "");
          providerInput.addEventListener("input", emit);
          modelInput.addEventListener("input", emit);
          thinkingSelect.addEventListener("change", emit);
          const pair = el("div", { className: "pair" });
          pair.append(providerInput, modelInput);
          const inputs = [providerInput, modelInput, thinkingSelect];
          return {
            harness,
            nodes: [field("model", "モデル", pair), field("level", "Thinking", thinkingSelect)],
            getSpec() {
              return {
                provider: providerInput.value.trim(),
                model: modelInput.value.trim(),
                thinking: thinkingSelect.value,
              };
            },
            setSpec(next) {
              providerInput.value = next.provider || "";
              modelInput.value = next.model || "";
              thinkingSelect.value = next.thinking || thinkingSelect.value;
            },
            setDisabled(disabled) {
              for (const node of inputs) node.disabled = disabled;
            },
          };
        }

        const modelSelect = el("select");
        modelSelect.setAttribute("aria-label", `${role} model`);
        const byProvider = new Map();
        for (const candidate of index.values()) {
          if (!byProvider.has(candidate.provider)) byProvider.set(candidate.provider, []);
          byProvider.get(candidate.provider).push(candidate);
        }
        for (const [providerId, candidates] of [...byProvider.entries()].sort()) {
          const group = el("optgroup");
          group.label = providerId;
          for (const candidate of candidates.sort((a, b) => a.id.localeCompare(b.id))) {
            const option = el("option", { value: `${providerId}\u0000${candidate.id}`, text: candidate.id });
            if (providerId === spec.provider && candidate.id === spec.model) option.selected = true;
            group.append(option);
          }
          modelSelect.append(group);
        }

        const thinkingSelect = el("select");
        thinkingSelect.setAttribute("aria-label", `${role} thinking`);

        // A long model ID can be cut off by the column; the tooltip shows it whole.
        const syncTitle = () => {
          modelSelect.title = modelSelect.selectedOptions[0]?.textContent || "";
        };

        /**
         * A stored spec outside the master must stay selectable. Otherwise the
         * browser picks the first option, and saving any other role would
         * silently rewrite this one. An unset role gets an explicit placeholder
         * instead of the same accidental first-option choice.
         */
        const selectModel = (key, thinking) => {
          if (key === "") {
            let placeholder = modelSelect.querySelector('option[value=""]');
            if (!placeholder) {
              placeholder = el("option", { value: "", text: "（未選択）" });
              modelSelect.prepend(placeholder);
            }
            modelSelect.value = "";
            fillThinking(thinkingSelect, [], thinking);
            syncTitle();
            return;
          }
          if (!index.has(key)) {
            let preserved = modelSelect.querySelector('option[data-preserved="1"]');
            if (!preserved) {
              preserved = el("option");
              preserved.dataset.preserved = "1";
              modelSelect.prepend(preserved);
            }
            preserved.value = key;
            preserved.textContent = `${key.split("\u0000").join("/")}（マスタ外）`;
          }
          modelSelect.value = key;
          fillThinking(thinkingSelect, levelsFor(index.get(key)), thinking);
          syncTitle();
        };

        selectModel(spec.model ? `${spec.provider}\u0000${spec.model}` : "", spec.thinking || "");

        const readModel = () => {
          const [provider, model] = modelSelect.value.split("\u0000");
          return { provider, model };
        };
        modelSelect.addEventListener("change", () => {
          fillThinking(thinkingSelect, levelsFor(index.get(modelSelect.value)), "");
          syncTitle();
          emit();
        });
        thinkingSelect.addEventListener("change", emit);

        return {
          harness,
          nodes: [field("model", "モデル", modelSelect), field("level", "Thinking", thinkingSelect)],
          getSpec() {
            const next = readModel();
            return { ...next, thinking: thinkingSelect.value };
          },
          setSpec(next) {
            selectModel(next.model ? `${next.provider}\u0000${next.model}` : "", next.thinking || "");
          },
          setDisabled(disabled) {
            modelSelect.disabled = disabled;
            thinkingSelect.disabled = disabled || thinkingSelect.dataset.baseDisabled === "1";
          },
        };
      }

      /**
       * Claude fields. The model is a canonical full ID chosen from the server's
       * list; the UI never offers an alias as a stored value. Model, effort and
       * the permission mode all come from the shared vocabularies, so a value
       * outside them can only be one that was already stored.
       */
      function claudeFields(role, spec, emit) {
        const harness = "claude";
        const modelSelect = el("select");
        modelSelect.setAttribute("aria-label", `${role} model`);
        fillVocabulary(modelSelect, vocabularies().claude.models, spec.model || "");
        const effortSelect = el("select");
        effortSelect.setAttribute("aria-label", `${role} effort`);
        fillVocabulary(effortSelect, vocabularies().claude.effort, spec.effort || "");
        const permissionSelect = el("select");
        permissionSelect.setAttribute("aria-label", `${role} permission_mode`);
        fillVocabulary(permissionSelect, vocabularies().claude.permission_mode, spec.permission_mode || "");
        modelSelect.addEventListener("change", emit);
        effortSelect.addEventListener("change", emit);
        permissionSelect.addEventListener("change", emit);
        const inputs = [modelSelect, effortSelect, permissionSelect];
        return {
          harness,
          nodes: [
            field("model", "モデル", modelSelect),
            field("level", "Effort", effortSelect),
            field("permission", "権限モード", permissionSelect),
          ],
          getSpec() {
            return {
              model: modelSelect.value,
              effort: effortSelect.value,
              permission_mode: permissionSelect.value,
            };
          },
          setSpec(next) {
            fillVocabulary(modelSelect, vocabularies().claude.models, next.model || "");
            fillVocabulary(effortSelect, vocabularies().claude.effort, next.effort || "");
            fillVocabulary(permissionSelect, vocabularies().claude.permission_mode, next.permission_mode || "");
          },
          setDisabled(disabled) {
            for (const node of inputs) node.disabled = disabled;
          },
        };
      }

      /**
       * Build one role: a head line (the name, plus whatever the card puts
       * beside it) and the grid of the harness choice and that harness's
       * fields. The harness is part of the role, so switching it replaces the
       * fields and clears the values that belonged to the other harness
       * instead of sending a mixed role.
       */
      function createRoleRow(draft, role, index, onChange, extras = {}) {
        const label = ROLE_LABELS[role] || role;
        const row = el("div", { className: "role" });
        const head = el("div", { className: "role-head" });
        head.append(extras.lead || el("span", { className: "role-name", text: label }));
        if (extras.trail) head.append(extras.trail);
        const controls = el("div", { className: "controls" });
        controls.setAttribute("role", "group");
        controls.setAttribute("aria-label", label);
        row.append(head, controls);

        const harnessSelect = el("select");
        harnessSelect.setAttribute("aria-label", `${role} harness`);
        for (const harness of ["pi", "claude"]) {
          const option = el("option", { value: harness, text: harness === "claude" ? "Claude" : "Pi" });
          if (roleHarness(draft.roles[role]) === harness) option.selected = true;
          harnessSelect.append(option);
        }
        controls.append(field("harness", "ハーネス", harnessSelect));

        let disabled = false;
        let widget = null;

        function getSpec() {
          return { harness: harnessSelect.value, ...widget.getSpec() };
        }

        const emit = () => {
          draft.roles[role] = getSpec();
          onChange(role);
        };

        function build(harness, spec) {
          for (const node of widget?.nodes || []) node.remove();
          widget = harness === "claude" ? claudeFields(role, spec, emit) : piFields(role, index, spec, emit);
          controls.append(...widget.nodes);
          widget.setDisabled(disabled);
        }

        harnessSelect.addEventListener("change", () => {
          const next = defaultRoleSpec(harnessSelect.value);
          draft.roles[role] = next;
          build(harnessSelect.value, next);
          onChange(role);
        });

        build(roleHarness(draft.roles[role]), draft.roles[role] || {});

        return {
          row,
          setSpec(next) {
            const harness = roleHarness(next);
            if (harness !== widget.harness) {
              harnessSelect.value = harness;
              build(harness, next);
            } else {
              widget.setSpec(next);
            }
            draft.roles[role] = { harness, ...widget.getSpec() };
          },
          setDisabled(value) {
            disabled = value;
            harnessSelect.disabled = value;
            widget?.setDisabled(value);
          },
          setActive(active) {
            row.classList.toggle("off", !active);
          },
          getSpec,
        };
      }

      function unknownLabel(unknown) {
        if (!unknown) return "";
        const parts = [];
        if (unknown.top && unknown.top.length) parts.push(`トップ: ${unknown.top.join(", ")}`);
        for (const [role, keys] of Object.entries(unknown.roles || {})) {
          parts.push(`${role}: ${keys.length ? keys.join(", ") : "(未知ロール)"}`);
        }
        return parts.join(" / ");
      }

      function createCard(draft, index) {
        const card = el("section", { className: "card" });
        const head = el("div", { className: "head" });
        head.append(el("h2", { text: draft.name }));
        const stateText = el("span", { className: "state" });
        stateText.setAttribute("role", "status");
        const save = el("button", { type: "button", text: "保存", className: "primary" });
        head.append(stateText, save);
        card.append(head);

        const unknownText = unknownLabel(draft.unknown);
        if (unknownText) {
          card.append(
            el("p", {
              className: "warn",
              text: `未知のキーがあります（保存すると削除されます）: ${unknownText}`,
            }),
          );
        }
        if (draft.error === "invalid-json") {
          card.append(el("p", { className: "warn", text: "このファイルは JSON として読めません。" }));
        }

        // A role that is not complete is not saved, so say so where it can be seen.
        const incomplete = el("p", { className: "warn" });
        incomplete.hidden = true;
        card.append(incomplete);

        const cols = el("div", { className: "cols" });
        cols.setAttribute("aria-hidden", "true");
        for (const header of COLUMN_HEADERS) cols.append(el("span", { text: header }));
        card.append(cols);

        const controls = {};
        let failed = false;

        const currentPayload = () =>
          savePayload(draft, (role) => controls[role]?.getSpec() || draft.roles[role]);

        const refreshState = () => {
          const dirty = JSON.stringify(currentPayload()) !== draft.baseline;
          if (dirty) draft.justSaved = false;
          const [text, kind] = failed
            ? ["保存に失敗しました", "failed"]
            : dirty
              ? ["未保存の変更があります", "dirty"]
              : draft.justSaved
                ? ["保存しました", "saved"]
                : ["", ""];
          stateText.textContent = text;
          stateText.className = kind ? `state ${kind}` : "state";
          save.classList.toggle("dirty", dirty);
        };

        const refreshNote = () => {
          const missing = ROLE_ORDER.filter(
            (role) =>
              (REQUIRED_ROLES.includes(role) || draft.optional[role]) && !roleComplete(draft.roles[role]),
          );
          incomplete.hidden = missing.length === 0;
          incomplete.textContent = missing.length
            ? `未設定のロールは保存されません: ${missing.map((role) => ROLE_LABELS[role]).join("、")}`
            : "";
        };

        const syncShared = () => {
          if (!controls["pr-fix"]) return;
          if (draft.prFixShared) {
            const impl = draft.roles.impl || defaultRoleSpec("pi");
            draft.roles["pr-fix"] = { ...impl };
            controls["pr-fix"].setSpec(impl);
            controls["pr-fix"].setDisabled(true);
          } else {
            controls["pr-fix"].setDisabled(false);
          }
        };

        const onChange = (role) => {
          failed = false;
          if (draft.prFixShared && role === "impl") syncShared();
          refreshNote();
          refreshState();
        };

        for (const role of ROLE_ORDER) {
          const extras = {};
          let useBox = null;
          if (OPTIONAL_ROLES.has(role)) {
            // The checkbox is the role's name: an unused role shows only this line.
            useBox = el("input", { type: "checkbox", checked: draft.optional[role] });
            useBox.setAttribute("aria-label", `${ROLE_LABELS[role]} を使う`);
            extras.lead = el("label", { className: "role-name" });
            extras.lead.append(useBox, document.createTextNode(ROLE_LABELS[role]));
          }
          if (role === "pr-fix") {
            const box = el("input", { type: "checkbox", checked: draft.prFixShared });
            box.addEventListener("change", () => {
              draft.prFixShared = box.checked;
              failed = false;
              syncShared();
              refreshNote();
              refreshState();
            });
            extras.trail = el("label", { className: "switch" });
            extras.trail.append(box, document.createTextNode("実装と同じ設定を使う"));
          }
          controls[role] = createRoleRow(draft, role, index, onChange, extras);
          if (useBox) {
            controls[role].setActive(draft.optional[role]);
            useBox.addEventListener("change", () => {
              draft.optional[role] = useBox.checked;
              if (useBox.checked && !roleComplete(draft.roles[role])) {
                // ui-tester starts from the full impl spec (harness included);
                // the orchestrator starts empty because it is not a team member.
                draft.roles[role] =
                  role === "orchestrator"
                    ? defaultRoleSpec("pi")
                    : { ...(draft.roles.impl || defaultRoleSpec("pi")) };
                controls[role].setSpec(draft.roles[role]);
              }
              controls[role].setActive(useBox.checked);
              failed = false;
              refreshNote();
              refreshState();
            });
          }
          card.append(controls[role].row);
        }
        syncShared();
        refreshNote();
        refreshState();

        save.addEventListener("click", async () => {
          if (busy) return;
          busy = true;
          save.disabled = true;
          try {
            const payload = currentPayload();
            const response = await fetch("/api/profile", {
              method: "PUT",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                profile: draft.name,
                expected_hash: draft.hash,
                pr_fix_shared_with_impl: payload.pr_fix_shared_with_impl,
                roles: payload.roles,
              }),
            });
            const result = await response.json();
            if (response.ok) {
              // The other cards keep their unsaved edits; this one reloads from the file.
              await load({ keepDrafts: true, saved: draft.name });
            } else {
              failed = true;
              refreshState();
              if (response.status === 409) {
                withReloadButton("他の変更と競合しました。再読込してから保存し直してください。");
              } else {
                setStatus(`保存できませんでした: ${result.record || result.reason || response.status}`, true);
              }
            }
          } catch (error) {
            failed = true;
            refreshState();
            setStatus(`通信に失敗しました: ${error.message}`, true);
          } finally {
            busy = false;
            save.disabled = false;
          }
        });

        return card;
      }

      function render() {
        elements.profiles.replaceChildren();
        if (!state) return;
        const index = candidateIndex(state.models);
        for (const profile of state.profiles) {
          const draft = drafts.get(profile.name) || draftFor(profile);
          elements.profiles.append(createCard(draft, index));
        }
      }

      function renderCatalog() {
        const models = state?.models;
        if (!models || models.status === "missing") {
          elements.catalog.textContent = "Pi カタログ未作成 — 自由入力";
          elements.catalog.className = "badge stale";
          return;
        }
        if (models.status !== "ok") {
          elements.catalog.textContent = "Pi カタログ破損 — 自由入力";
          elements.catalog.className = "badge stale";
          return;
        }
        const count = models.providers.reduce((total, provider) => total + provider.models.length, 0);
        const reason = models.stale
          ? models.stale_reason === "pi-version"
            ? ` · 古い (pi ${models.pi_version} ≠ ${models.current_pi_version})`
            : " · 古い (30 日超)"
          : "";
        elements.catalog.textContent = `${models.providers.length} providers / ${count} models · pi ${models.pi_version}${reason}`;
        elements.catalog.className = models.stale ? "badge stale" : "badge";
      }

      /**
       * Read the state and redraw. A plain load discards every draft. After a
       * save or a catalog refresh only the profile whose file changed is
       * rebuilt: a draft survives while its file hash is unchanged, so saving
       * one card never throws away unsaved edits on another.
       */
      async function load({ keepDrafts = false, saved = "" } = {}) {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          state = await response.json();
          const next = new Map();
          for (const profile of state.profiles) {
            const existing = keepDrafts ? drafts.get(profile.name) : null;
            next.set(profile.name, existing && existing.hash === profile.hash ? existing : draftFor(profile));
          }
          if (saved && next.has(saved)) next.get(saved).justSaved = true;
          drafts.clear();
          for (const [name, draft] of next) drafts.set(name, draft);
          renderCatalog();
          render();
          setStatus("", false);
        } catch (error) {
          setStatus(`読み込みに失敗しました: ${error.message}`, true);
        }
      }

      elements.refresh.addEventListener("click", async () => {
        if (busy) return;
        busy = true;
        elements.refresh.disabled = true;
        setStatus("カタログを更新しています…", false);
        try {
          const response = await fetch("/api/models/refresh", { method: "POST" });
          const payload = await response.json();
          if (response.ok) {
            await load({ keepDrafts: true });
            setStatus("カタログを更新しました", false);
          } else {
            setStatus(`更新に失敗しました: ${payload.record || payload.reason || response.status}`, true);
          }
        } catch (error) {
          setStatus(`通信に失敗しました: ${error.message}`, true);
        } finally {
          busy = false;
          elements.refresh.disabled = false;
        }
      });

      const THEME_KEY = "pi-model-editor-theme";
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)");

      function currentTheme() {
        return document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light");
      }

      /** The label names the theme a click switches to; both labels are the same width. */
      function renderThemeButton() {
        elements.theme.textContent = currentTheme() === "dark" ? "ライトモードにする" : "ダークモードにする";
      }

      elements.theme.addEventListener("click", () => {
        const next = currentTheme() === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch (error) {
          // The choice still applies to this page; it is only not remembered.
        }
        renderThemeButton();
      });
      // Until a choice is made the page follows the OS, so keep the label in step with it.
      systemDark.addEventListener("change", renderThemeButton);
      renderThemeButton();

      load();
    </script>
  </body>
</html>
