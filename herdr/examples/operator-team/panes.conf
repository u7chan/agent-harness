# Herdr labels for the standing composition. Every label literal lives in this
# one file: the scripts, the role documents, and the skill never carry a value.
# Form: '<role> (<name>)' - the role part is stable, the name part is the
# display name the user chose for that pane.
WORKSPACE_LABEL='operator'
ORCHESTRATOR_LABEL='orchestrator (alpha)'
ADVISOR_LABEL='advisor (beta)'
SCRIBE_LABEL='scribe (gamma)'
CONTROLLER_LABEL='controller (delta)'
ADVISOR_TAB='advisor'
SCRIBE_TAB='records'
CONTROLLER_TAB='controller'

# Optional plugin pane beside the orchestrator pane. The label must match the
# plugin manifest's title.
BOARD_LABEL='board'
BOARD_PLUGIN='example.status-board'
BOARD_ENTRYPOINT='board'
