name: contract-tests

# Runs the gh dispatcher contract suite and the action catalog consistency
# check on every push and pull request. Both checks are hermetic: they run
# unauthenticated with no credentials, no network access, and no real gh CLI
# (the suite supplies a fixture gh.sh and a fake gh CLI where needed).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests and action consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gh dispatcher contract suite
        run: gh/tests/contract/run.sh

      - name: Run action catalog consistency check
        run: gh/scripts/check-actions.sh
