name: contract-tests

# Runs the gh dispatcher contract suite, the action catalog consistency
# check, and the playwright skill mock tests on every push and pull request.
# All checks are hermetic: they run unauthenticated with no credentials, no
# network access, no real gh CLI (the suite supplies a fixture gh.sh and a
# fake gh CLI where needed), and no real browser (the playwright suite
# supplies a fake playwright-cli shim).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests, consistency checks, and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run gh dispatcher contract suite
        run: gh/tests/contract/run.sh

      - name: Run action catalog consistency check
        run: gh/scripts/check-actions.sh

      - name: Run playwright skill mock tests
        run: playwright/tests/run.sh
