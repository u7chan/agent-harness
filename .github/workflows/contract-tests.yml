name: contract-tests

# Runs the gh dispatcher contract suite, the action catalog consistency
# check, the review payload and recheck tests, the playwright skill mock tests,
# the Herdr async wrapper tests, shared development model-spec and team-profile
# tests, both PR workflow documentation contracts, the herdr-issue-review start-gate documentation
# contract, and the markdown link and anchor check over every
# skill's SKILL.md and references on every push and pull request. All checks are
# hermetic: they run unauthenticated with no credentials, no network access, no
# real gh CLI (the suite supplies a fixture gh.sh and a fake gh CLI where
# needed), no real browser (the playwright suite
# supplies a fake playwright-cli shim), no real Herdr (the wrapper suite
# supplies a fake herdr CLI), and no installed pi (the model-spec suite loads
# the pure classification module only, and the team-record suite replaces the
# model-spec resolver with a stub through --resolver). The markdown check reads
# only local files and resolves nothing over the network. A separate macOS job
# exercises the shared attachment path with the system Bash 3.2 and GNU
# coreutils; it also uses only the mock gh CLI (no uploads or credentials).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests, consistency checks, and mock tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run gh dispatcher contract suite
        run: gh/tests/contract/run.sh

      - name: Run action catalog consistency check
        run: gh/scripts/check-actions.sh

      - name: Run review payload and recheck contract tests
        run: review/tests/run.sh

      - name: Run playwright skill mock tests
        run: playwright/tests/run.sh

      - name: Run Herdr async wrapper tests
        run: herdr/tests/run.sh

      - name: Run shared development model-spec and team-profile tests
        run: scripts/pi-development/tests/run.sh

      - name: Run herdr-pi-issue-pr-workflow documentation contracts
        run: herdr-pi-issue-pr-workflow/tests/run.sh

      - name: Run herdr-pi-pr-review-workflow documentation contracts
        run: herdr-pi-pr-review-workflow/tests/run.sh

      # The start-gate suite reads herdr-issue-review/SKILL.md only; it needs neither
      # Herdr nor pi, so it runs in the same hermetic job.
      - name: Run herdr-issue-review start-gate contract tests
        run: herdr-issue-review/tests/run.sh

      # The skill list comes from package.json, the manifest that defines the
      # served skill set, so a newly added skill is checked without editing
      # this workflow.
      - name: Run markdown link and anchor check
        run: scripts/check-markdown-links.sh $(jq -r '.pi.skills[]' package.json)

  macos-attachments:
    name: macOS attachments (system Bash 3.2, mock gh)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure GNU coreutils for the test process
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew list --versions coreutils || brew install coreutils

      # The fixture runs the dispatcher with the test's $BASH, so Homebrew
      # cannot silently replace the system interpreter selected here. GNU
      # tools apply only to this test process, not to the Ubuntu/WSL flow.
      - name: Run attachment contracts with macOS system Bash
        run: |
          env PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH" \
            /bin/bash gh/tests/contract/attach.sh
